name: CI

# Branch pushes are covered by their pull request, so only main runs on push.
# Otherwise every commit on a pull request runs the fuzz and differential
# jobs twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its older run. Runs on main are left
# to finish so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Dependencies come from the opam files only.
jobs:
  # The Eio adapters need OCaml 5, so the oldest compiler builds the rest.
  test:
    name: OCaml ${{ matrix.ocaml-compiler }}
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - ocaml-compiler: "4.14"
            packages: bhttp,ohttp,ohttp-cohttp,ohttp-cohttp-lwt
          - ocaml-compiler: "5.4"
            packages: bhttp,ohttp,ohttp-cohttp,ohttp-cohttp-lwt,ohttp-cohttp-eio,ohttp-piaf
    env:
      PACKAGES: ${{ matrix.packages }}
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
      - name: Install dependencies
        run: opam install $(echo "$PACKAGES" | sed 's/[^,]*/.\/&.opam/g; s/,/ /g') --deps-only --with-test --with-doc
      - name: Build, test, and build documentation
        run: opam exec -- dune build --only-packages "$PACKAGES" @all @runtest @doc

  packaging:
    name: opam packages
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.4"
          dune-cache: true
      - name: Lint the opam packages
        run: opam lint *.opam
      # Each package must build and pass its tests with only the packages it
      # depends on installed.
      - name: Install bhttp from its package definition
        run: opam install ./bhttp.opam --with-test
      - name: Install ohttp from its package definition
        run: opam install ./ohttp.opam --with-test
      - name: Install the adapters from their package definitions
        run: |
          opam install ./ohttp-cohttp.opam --with-test
          opam install ./ohttp-cohttp-lwt.opam --with-test
          opam install ./ohttp-cohttp-eio.opam --with-test
          opam install ./ohttp-piaf.opam --with-test

  # The dev setup brings ocamlformat and cohttp-lwt-unix. The examples need an
  # HTTP library, which ohttp and bhttp do not depend on. Without one they
  # build as stubs that explain themselves, so ask the end-to-end run to fail if
  # that is what it turns out to be.
  hygiene:
    name: Formatting and examples
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.4"
          dune-cache: true
      - name: Install dependencies and the dev setup
        run: opam install . --deps-only --with-dev-setup
      - name: Check formatting
        run: opam exec -- dune build @fmt
      - name: Build the examples
        run: opam exec -- dune build ./examples
      - name: Run the basic example
        run: opam exec -- dune exec examples/basic.exe
      - name: Run the end-to-end example
        run: opam exec -- dune exec examples/e2e.exe -- --require

  fuzz:
    name: Decoder fuzzing
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.4"
          dune-cache: true
      - name: Install test dependencies
        run: opam install ./bhttp.opam ./ohttp.opam --deps-only --with-test
      - name: Compile the fuzz targets
        run: opam exec -- dune build --profile fuzz fuzz/fuzz_bhttp.exe fuzz/fuzz_ohttp.exe
      # --repeat counts runs of each test. doc/development.md has the longer
      # run for changes to a decoder.
      - name: Run bounded fuzzing
        run: |
          opam exec -- _build/default/fuzz/fuzz_bhttp.exe --repeat 300 --seed 9292
          opam exec -- _build/default/fuzz/fuzz_ohttp.exe --repeat 300 --seed 9458

  # The Go peer only: the Rust peer needs a Docker build that is slow to
  # repeat, and what both produced is replayed by the test job.
  differential:
    name: Differential against Go
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.4"
          dune-cache: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/differential/go/go.mod
          cache-dependency-path: tools/differential/go/go.sum
      - name: Install test dependencies
        run: opam install ./bhttp.opam ./ohttp.opam --deps-only --with-test
      - name: Build the driver
        run: opam exec -- dune build ./tools/differential/differential.exe
      - name: Build the Go peer
        working-directory: tools/differential/go
        run: go build -o ../../../go-peer .
      - name: Compare against the Go peer
        run: >-
          opam exec -- ./_build/default/tools/differential/differential.exe
          --peer go=./go-peer --require go
          --rfc9292 test/vectors/rfc9292.json --count 4
